name: Build & Push Warrior World Web3 Brain

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: warriorworld/hermes-brain
  HERMES_SOURCE_REPO: NousResearch/hermes-agent
  HERMES_SOURCE_REF: bf0203a794a07aac3ff764972ab9087baa4e4f4e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (seed + Dockerfile + init)
        uses: actions/checkout@v4

      - name: Checkout official Hermes source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HERMES_SOURCE_REPO }}
          ref: ${{ env.HERMES_SOURCE_REF }}
          path: hermes-src

      - name: Verify source checkout
        run: |
          ls hermes-src | head -20
          test -f hermes-src/Dockerfile && echo "official Dockerfile found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build official Hermes base from public source
        uses: docker/build-push-action@v6
        with:
          context: hermes-src
          file: hermes-src/Dockerfile
          push: true
          tags: warriorworld/hermes-brain:base-20261031
          build-args: |
            HERMES_BOT_DESKTOP=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build brain image (official base + Warrior World seed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            warriorworld/hermes-brain:20261031
            warriorworld/hermes-brain:20261031e
            warriorworld/hermes-brain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max