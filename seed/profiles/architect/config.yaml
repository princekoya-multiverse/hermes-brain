# Warrior World WEB3 manager — runs ON the Akash brain (fully self-contained).
# ⛔ No desktop IPs. Routes model calls straight to OpenRouter.
model:
  default: deepseek/deepseek-v4-flash-0731
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
agent:
  max_turns: 150
  gateway_timeout: 1800
  coding_context: auto
gateway:
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
memory:
  files:
    - /opt/data/memories/MISSION.md
    - /opt/data/memories/warrior-world-master-brief.md
